<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌词</title>
  <style>
    :root {
      --bg: #1a1a2e; --card: #16213e; --accent: #e94560; --text: #eee;
      --muted: #8892a4; --border: #2a2a4a;
    }
    [data-theme="light"] {
      --bg: #f5f5f5; --card: #fff; --text: #222; --muted: #666;
      --border: #ddd; --accent: #d63447;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system,'Segoe UI',sans-serif;
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }
    .header {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .header .title { flex: 1; font-size: 0.85rem; color: var(--muted); text-align: center; }
    .header .song-name { font-size: 0.9rem; color: var(--text); font-weight: 600; }
    .lines {
      flex: 1; overflow-y: auto; padding: 0.75rem;
    }
    .lrc-line { text-align: center; padding: 0.4rem 0.5rem; font-size: 0.9rem; color: var(--muted);
      transition: color 0.3s, font-size 0.3s; border-radius: 4px; }
    .lrc-line.active { color: var(--accent); font-size: 1.05rem; font-weight: 700; }
    .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title" id="song-label">等待播放...</span>
  </div>
  <div class="lines" id="lyrics-lines">
    <div class="empty">请在主窗口中播放歌曲</div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const port = (new URLSearchParams(location.search).get('port'))||'8899';
    const API_BASE = 'http://127.0.0.1:'+port;
    let lrcParsed = [];
    let synced = false;

    // 每 2s 轮询主窗口的当前播放（通过 localStorage 通信）
    let lastSongId = '';
    setInterval(async ()=>{
      const info = localStorage.getItem('mf_now_playing');
      if (!info) return;
      let data;
      try { data = JSON.parse(info); } catch { return; }
      if (!data.song_id || data.song_id === lastSongId) return;
      lastSongId = data.song_id;
      $('song-label').textContent = data.name + ' — ' + data.singer;
      await loadLyric(data.name, data.singer);
    }, 2000);

    async function loadLyric(name, singer) {
      try {
        const r = await fetch(`${API_BASE}/api/lyric?name=${encodeURIComponent(name)}&artist=${encodeURIComponent(singer)}`);
        const d = await r.json();
        const txt = d.lyric || null;
        if (!txt) { $('lyrics-lines').innerHTML = '<div class="empty">暂无歌词</div>'; return; }
        lrcParsed = d.synced ? txt.split('\n').map(parseLrcLine).filter(Boolean) : txt.split('\n').filter(l=>l.trim()).map((l,i)=>({t:-1, text:l.trim()}));
        synced = d.synced;
        $('lyrics-lines').innerHTML = lrcParsed.map(l=>'<div class="lrc-line" data-t="'+l.t+'">'+esc(l.text)+'</div>').join('');
        if (!synced) $('lyrics-lines').querySelectorAll('.lrc-line').forEach(l=>l.classList.add('active'));
      } catch { $('lyrics-lines').innerHTML = '<div class="empty">歌词加载失败</div>'; }
    }

    function parseLrcLine(line) {
      const m=line.match(/^\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
      if (!m) return null;
      return {t:parseInt(m[1])*60+parseInt(m[2])+parseInt(m[3])/1000, text:m[4].trim()};
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  </script>
</body>
</html>
